<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('维护')}"></head>
<body>
<header th:replace="~{admin/layout :: nav}"></header>
<main class="wrap">
    <div class="headline">
        <div><p class="eyebrow">P5 · OPS</p><h1>维护</h1>
            <p class="muted">查看缓存、审计与会话体量，或立即触发一次清理；写操作需要 sudo 并写入审计。</p></div>
    </div>
    <div class="banner ok" th:if="${saved}" th:text="${saved}"></div>
    <div class="banner error" th:if="${error}" th:text="${error}"></div>
    <div class="banner" th:if="${!adminUser.hasSudo()}">写操作需要 sudo。</div>

    <section class="cards">
        <article class="card">
            <span>封面缓存</span>
            <b th:text="${images['ok_rows']} + ' 项 · ' + ${imageBytesText}"></b>
            <small th:text="'上限 ' + ${maxBytesText} + ' · TTL ' + ${ttlDays} + ' 天'"></small>
            <small class="muted" th:text="${images['oldest']} != null ? '最早 ' + ${images['oldest']} : '暂无缓存'"></small>
        </article>
        <article class="card">
            <span>审计日志</span>
            <b th:text="${auditLog['rows']} + ' 行'"></b>
            <small th:text="'保留 ' + ${auditDays} + ' 天'"></small>
            <small class="muted" th:text="${auditLog['oldest']} != null ? '最早 ' + ${auditLog['oldest']} : '暂无记录'"></small>
        </article>
        <article class="card">
            <span>管理会话</span>
            <b th:text="${adminSessions['active']} + ' 个有效'"></b>
            <small th:text="'共 ' + ${adminSessions['total']} + ' 行（含已撤销）'"></small>
            <small class="muted">每小时 :17 自动清理过期行</small>
        </article>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>封面缓存</h2><span class="muted small">按 TTL 与 95% 容量上限回收</span></div>
        <form th:action="@{/admin/maintenance/images/gc}" method="post" class="row-form">
            <input type="hidden" name="_csrf" th:value="${csrf}">
            <p class="muted small">删除过期或超限的 DB 行，并删除 <code>/data/images</code> 下对应文件；删除后不可恢复。</p>
            <button type="submit">立即清理封面缓存</button>
        </form>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>审计日志</h2><span class="muted small">每日 04:40 自动执行</span></div>
        <form th:action="@{/admin/maintenance/audit/purge}" method="post" class="row-form">
            <input type="hidden" name="_csrf" th:value="${csrf}">
            <p class="muted small">调用 <code>teaplayer_purge_audit(days)</code> 删除超过保留期的审计行。</p>
            <button type="submit">立即清理审计日志</button>
        </form>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>管理会话</h2><span class="muted small">登录时也会顺带清理</span></div>
        <form th:action="@{/admin/maintenance/sessions/purge}" method="post" class="row-form">
            <input type="hidden" name="_csrf" th:value="${csrf}">
            <p class="muted small">删除已过期以及撤销超过 7 天的会话行；不影响当前登录。</p>
            <button type="submit">立即清理过期会话</button>
        </form>
    </section>
</main>
<footer th:replace="~{admin/layout :: foot}"></footer>
</body>
</html>
