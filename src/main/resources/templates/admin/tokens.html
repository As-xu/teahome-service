<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Token')}"></head>
<body>
<header th:replace="~{admin/layout :: nav}"></header>
<main class="wrap">
    <div class="headline">
        <div><p class="eyebrow">P4 · ACCESS</p><h1>Token 与管理员</h1>
            <p class="muted">Token 只在创建时显示一次；管理员密码用 Argon2id，不存明文。</p></div>
    </div>
    <div class="banner ok" th:if="${saved}" th:text="${saved}"></div>
    <div class="banner error" th:if="${error}" th:text="${error}"></div>
    <div class="token-reveal" th:if="${newToken != null}">
        <p>新 Token（离开本页后无法再次查看）：</p>
        <code th:text="${newToken}">ths_...</code>
    </div>

    <div class="grid-2">
        <section class="panel">
            <div class="panel-head"><h2>创建 API Token</h2></div>
            <form th:action="@{/admin/tokens}" method="post" class="stack">
                <input type="hidden" name="_csrf" th:value="${csrf}">
                <label>标签 <input name="label" required maxlength="60" placeholder="例如 手机"></label>
                <label class="check"><input type="checkbox" name="read" value="true" checked> read（读接口）</label>
                <label class="check"><input type="checkbox" name="admin" value="true"> admin（管理接口）</label>
                <label>有效期天数（0=永久）<input name="expiresDays" type="number" min="0" max="3650" value="0"></label>
                <button type="submit">创建</button>
            </form>
            <p class="muted small">管理 scope 能读写配置；日常客户端只给 read。</p>
        </section>
        <section class="panel">
            <div class="panel-head"><h2>创建管理员</h2></div>
            <form th:action="@{/admin/users}" method="post" class="stack">
                <input type="hidden" name="_csrf" th:value="${csrf}">
                <label>用户名 <input name="username" required pattern="[a-z][a-z0-9_.-]{2,31}" placeholder="小写 3-32 位"></label>
                <label>显示名 <input name="displayName" maxlength="60"></label>
                <label>角色
                    <select name="role"><option value="viewer">viewer（只读）</option><option value="admin">admin</option><option value="owner">owner</option></select>
                </label>
                <label>初始密码 <input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
                <button type="submit">创建</button>
            </form>
        </section>
    </div>

    <section class="panel">
        <div class="panel-head"><h2>API Token</h2></div>
        <table>
            <thead><tr><th>#</th><th>标签</th><th>前缀</th><th>scope</th><th>状态</th><th>创建</th><th>过期</th><th>最近使用</th><th></th></tr></thead>
            <tbody>
            <tr th:each="t : ${tokens}">
                <td th:text="${t['id']}"></td>
                <td th:text="${t['label']}"></td>
                <td class="mono" th:text="${t['token_prefix']}"></td>
                <td class="mono" th:text="${t['scopes']}"></td>
                <td><span class="pill" th:text="${t['status']}" th:classappend="' ' + ${t['status']}"></span></td>
                <td class="mono small" th:text="${t['created_at']}"></td>
                <td class="mono small" th:text="${t['expires_at']} ?: '永久'"></td>
                <td class="mono small" th:text="${t['last_used_at']} ?: '—'"></td>
                <td>
                    <form th:if="${t['status'] == 'active'}" th:action="@{/admin/tokens/{id}/revoke(id=${t['id']})}" method="post">
                        <input type="hidden" name="_csrf" th:value="${csrf}">
                        <button class="danger" type="submit">吊销</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>管理员</h2></div>
        <table>
            <thead><tr><th>#</th><th>用户名</th><th>显示名</th><th>角色</th><th>状态</th><th>最近登录</th><th>重置密码</th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u['id']}"></td>
                <td class="mono" th:text="${u['username']}"></td>
                <td th:text="${u['display_name']}"></td>
                <td th:text="${u['role']}"></td>
                <td th:text="${u['status']}"></td>
                <td class="mono small" th:text="${u['last_login_at']} ?: '—'"></td>
                <td>
                    <form th:action="@{/admin/users/{id}/password(id=${u['id']})}" method="post" class="row-form">
                        <input type="hidden" name="_csrf" th:value="${csrf}">
                        <input type="password" name="password" minlength="12" placeholder="新密码 ≥12" required>
                        <button type="submit">重置</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<footer th:replace="~{admin/layout :: foot}"></footer>
</body>
</html>
